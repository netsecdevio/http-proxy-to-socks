name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint

  test:
    name: test (${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [ 20, 22, 24 ]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test

  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Audit runtime dependencies only
        run: |
          set -euo pipefail
          npm ci --omit=dev --no-audit --no-fund
          npm audit --omit=dev --audit-level=high

  package:
    name: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Pack, inspect, and run the published artifact
        run: |
          set -euo pipefail
          TARBALL=$(npm pack --silent)
          echo "tarball: ${TARBALL}"
          echo "--- shipped files ---"
          tar -tzf "$TARBALL" | sed 's|^package/||' | sort

          if tar -tzf "$TARBALL" | grep -q '__tests__'; then
            echo "::error::tests must not ship in the package"; exit 1
          fi
          if tar -tzf "$TARBALL" | grep -q 'node_modules'; then
            echo "::error::node_modules must not ship in the package"; exit 1
          fi
          if tar -tzf "$TARBALL" | grep -q '^package/src/server.js$'; then :; else
            echo "::error::src/server.js is missing from the package"; exit 1
          fi

          mkdir -p "$RUNNER_TEMP/verify"
          npm install --prefix "$RUNNER_TEMP/verify" "./$TARBALL" --no-audit --no-fund
          "$RUNNER_TEMP/verify/node_modules/.bin/hpts" --version
          "$RUNNER_TEMP/verify/node_modules/.bin/hpts" --help | head -3

  dependency-review:
    name: dependency-review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
